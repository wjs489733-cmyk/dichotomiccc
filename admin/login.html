<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Dichotomiccc</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-login-page theme-black">
  <div class="login-container">
    <div class="login-box">
      <header class="login-header">
        <h1 class="galmuri admin-logo">dichotomiccc</h1>
        <p class="admin-subtitle">Admin Panel</p>
      </header>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email" class="galmuri">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="admin@dichotomiccc.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="galmuri">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <button type="submit" class="btn-primary galmuri" id="loginBtn">
          <span class="btn-text">Login</span>
          <span class="btn-loading" style="display: none;">Loading...</span>
        </button>
      </form>

      <footer class="login-footer">
        <a href="../index.html" class="back-link galmuri">← Back to site</a>
      </footer>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
