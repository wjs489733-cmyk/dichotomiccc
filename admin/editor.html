<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Editor - Dichotomiccc Admin</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <!-- Quill.js WYSIWYG Editor -->
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body class="admin-editor-page">
  <!-- Header -->
  <header class="admin-header">
    <div class="admin-header-left">
      <a href="./dashboard.html" class="admin-header-logo galmuri">dichotomiccc</a>
      <nav>
        <ul class="admin-nav galmuri">
          <li><a href="./dashboard.html">Projects</a></li>
          <li><a href="../index.html" target="_blank">View Site ↗</a></li>
        </ul>
      </nav>
    </div>
    <div class="admin-header-right">
      <span class="admin-user galmuri" id="userEmail"></span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="admin-main editor-main">
    <div class="editor-header">
      <a href="./dashboard.html" class="back-link galmuri">&larr; Back to Dashboard</a>
      <h1 class="admin-title galmuri" id="pageTitle">New Project</h1>
    </div>

    <form id="projectForm" class="editor-form">
      <!-- Basic Info -->
      <section class="editor-section">
        <div class="form-row">
          <div class="form-group form-group-large">
            <label for="title" class="galmuri">Project Title *</label>
            <input type="text" id="title" name="title" class="form-input" placeholder="Enter project title" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category" class="galmuri">Category *</label>
            <select id="category" name="category" class="form-select" required>
              <option value="">Select category</option>
              <option value="uxui">UXUI</option>
              <option value="branding">Branding</option>
              <option value="editorial">Editorial</option>
              <option value="graphic">Graphic</option>
              <option value="motion">Motion</option>
              <option value="etc">Etc</option>
            </select>
          </div>
          <div class="form-group">
            <label for="year" class="galmuri">Year *</label>
            <input type="text" id="year" name="year" class="form-input" placeholder="2024" required>
          </div>
        </div>
      </section>

      <!-- Thumbnail -->
      <section class="editor-section">
        <h2 class="section-title galmuri">Thumbnail *</h2>
        <div class="thumbnail-upload">
          <div class="thumbnail-preview" id="thumbnailPreview">
            <span class="upload-placeholder">Click to upload</span>
          </div>
          <input type="file" id="thumbnailInput" accept="image/*" hidden>
          <button type="button" class="btn-upload" id="thumbnailBtn">Upload Image</button>
          <p class="upload-hint galmuri">Recommended: 3:4 ratio, min 600px width</p>
        </div>
      </section>

      <!-- Gallery Images -->
      <section class="editor-section">
        <h2 class="section-title galmuri">Gallery Images</h2>
        <div class="gallery-upload">
          <div class="gallery-grid" id="galleryGrid">
            <!-- Gallery items will be added here -->
            <div class="gallery-add" id="galleryAddBtn">
              <span>+</span>
            </div>
          </div>
          <input type="file" id="galleryInput" accept="image/*" multiple hidden>
          <p class="upload-hint galmuri">You can upload multiple images for the project gallery</p>
        </div>
      </section>

      <!-- Description -->
      <section class="editor-section">
        <h2 class="section-title galmuri">Description</h2>
        <div class="editor-wrapper">
          <div id="quillEditor"></div>
        </div>
      </section>

      <!-- Settings -->
      <section class="editor-section">
        <h2 class="section-title galmuri">Settings</h2>
        <div class="settings-group">
          <label class="checkbox-label">
            <input type="checkbox" id="isFeatured" name="isFeatured">
            <span class="checkbox-custom"></span>
            <span class="galmuri">Featured (Show in Selected Work)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="isPublished" name="isPublished" checked>
            <span class="checkbox-custom"></span>
            <span class="galmuri">Published (Visible to public)</span>
          </label>
        </div>
      </section>

      <!-- Actions -->
      <div class="editor-actions">
        <button type="button" class="btn-cancel" onclick="window.location.href='./dashboard.html'">Cancel</button>
        <button type="submit" class="btn-save galmuri" id="saveBtn">
          <span class="btn-text">Save Project</span>
          <span class="btn-loading" style="display: none;">Saving...</span>
        </button>
      </div>
    </form>
  </main>

  <!-- Quill.js -->
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="../js/admin-editor.js"></script>
</body>
</html>
