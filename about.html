<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>about · dichotomiccc</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Galmuri -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" />

  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/about.css" />

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body class="theme-default">
  <main class="about-wrap">
    <header class="about-header">
      <h1 class="galmuri" id="aboutTitle" style="cursor: pointer;">about</h1>
      <a class="back galmuri" href="#" id="backBtn">← back</a>
    </header>

    <section class="about-card" id="aboutContent">
      <h2 class="galmuri" id="profileName">min</h2>
      <p id="profileBio">
        시각디자인을 공부하며, 브랜딩·편집·UXUI·모션까지 폭넓게 실험하는 아카이브를 만들고 있다.
        이 사이트는 프로젝트를 "작품"이 아니라 "과정"으로 남기기 위한 공간이다.
      </p>
      <ul id="profileInfo">
        <li>Focus: <span id="profileFocus">branding / editorial / uxui / graphic</span></li>
        <li>Tools: <span id="profileTools">Figma, Adobe CC, Cinema 4D, Web</span></li>
        <li>Contact: <a href="mailto:wjs400@naver.com" id="contactEmail">wjs400@naver.com</a></li>
      </ul>
      <div id="additionalContent"></div>
      <p class="note" id="pageNote">텍스트/이미지 업데이트는 계속 진행 중이다.</p>
    </section>

    <nav class="page-nav galmuri">
      <a href="./contact.html" class="nav-link">contact →</a>
    </nav>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/home.js"></script>
  <script src="./js/admin-float.js"></script>
  <script>
    const API_URL = CONFIG.API_URL;

    // API에서 About 페이지 데이터 로드
    async function loadAboutPage() {
      try {
        const response = await fetch(`${API_URL}/pages/about`);
        if (!response.ok) return;

        const result = await response.json();
        const page = result.data;

        if (page.profile) {
          if (page.profile.name) {
            document.getElementById('profileName').textContent = page.profile.name;
          }
          if (page.profile.bio) {
            document.getElementById('profileBio').textContent = page.profile.bio;
          }
          if (page.profile.focus) {
            document.getElementById('profileFocus').textContent = page.profile.focus;
          }
          if (page.profile.tools) {
            document.getElementById('profileTools').textContent = page.profile.tools;
          }
        }

        if (page.contactInfo && page.contactInfo.email) {
          const emailEl = document.getElementById('contactEmail');
          emailEl.textContent = page.contactInfo.email;
          emailEl.href = `mailto:${page.contactInfo.email}`;
        }

        if (page.content && page.content.trim() !== '' && page.content !== '<p><br></p>') {
          document.getElementById('additionalContent').innerHTML = page.content;
        }

        // Note 문구 업데이트
        if (page.note && page.note.trim() !== '') {
          document.getElementById('pageNote').textContent = page.note;
        }

      } catch (error) {
        console.log('Using default about content');
      }
    }

    // 페이지 로드 시 데이터 가져오기
    loadAboutPage();

    // About 페이지 네비게이션
    const backBtn = document.getElementById('backBtn');
    const aboutTitle = document.getElementById('aboutTitle');

    // back 버튼 클릭 시 홈 화면으로 이동 (인트로 건너뛰기)
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.setItem('introVisited', 'true');
        window.location.href = './index.html';
      });
    }

    // about 제목 클릭 시 홈페이지로 이동 (인트로 건너뛰기)
    if (aboutTitle) {
      aboutTitle.addEventListener('click', () => {
        // 인트로를 건너뛰고 바로 홈으로
        localStorage.setItem('introVisited', 'true');
        window.location.href = './index.html';
      });
    }
  </script>
</body>
</html>
