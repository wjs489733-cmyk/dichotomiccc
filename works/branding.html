<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branding · dichotomiccc</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Galmuri -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" />

  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/gallery.css" />

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body class="theme-default">
  <!-- Theme Switcher -->
  <div class="theme-switcher" id="themeSwitcher" aria-label="theme switcher">
    <button class="theme-btn" id="themeBtn" aria-label="테마 열기"></button>
    <div class="theme-menu" id="themeMenu" aria-label="theme menu">
      <button class="theme-option white" data-theme="white" aria-label="화이트 테마"></button>
      <button class="theme-option black" data-theme="black" aria-label="블랙 테마"></button>
      <button class="theme-option mint" data-theme="mint" aria-label="민트 테마"></button>
      <button class="theme-option red hidden" data-theme="red" aria-label="레드 테마" id="redTheme"></button>
    </div>
  </div>

  <main class="gallery-wrap">
    <header class="gallery-header">
      <h1 class="galmuri gallery-title">Branding</h1>
      <a class="back galmuri" href="../index.html" id="backBtn">← back</a>
    </header>

    <!-- 갤러리 그리드 -->
    <section class="gallery-grid">
      <!-- 갤러리 아이템 예시 -->
      <article class="gallery-item">
        <a href="../projects/project-name-1.html" class="item-link">
          <div class="item-image">
            <img src="../assets/img/works/branding/01.jpg" alt="Project 1">
          </div>
          <div class="item-info">
            <h2 class="item-title">Project Title 1</h2>
            <p class="item-year">2024</p>
          </div>
        </a>
      </article>

      <article class="gallery-item">
        <a href="../projects/project-name-2.html" class="item-link">
          <div class="item-image">
            <img src="../assets/img/works/branding/02.jpg" alt="Project 2">
          </div>
          <div class="item-info">
            <h2 class="item-title">Project Title 2</h2>
            <p class="item-year">2024</p>
          </div>
        </a>
      </article>

      <!-- 추가 프로젝트들 -->
      <!-- 동일한 구조로 추가 -->
    </section>
  </main>

  <script src="../js/home.js"></script>
  <script>
    // Back 버튼 클릭 시 홈으로
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.setItem('introVisited', 'true');
        window.location.href = '../index.html';
      });
    }
  </script>
</body>
</html>
