<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Branding · dichotomiccc</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Galmuri -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" />

  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/gallery.css" />

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body class="theme-default">
  <main class="gallery-wrap">
    <header class="gallery-header">
      <h1 class="galmuri gallery-title">Branding</h1>
      <a class="back galmuri" href="../index.html" id="backBtn">← back</a>
    </header>

    <!-- 갤러리 그리드 - API에서 동적으로 로드됨 -->
    <section class="gallery-grid">
      <div class="loading-state">
        <p class="galmuri">Loading projects...</p>
      </div>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/home.js"></script>
  <script src="../js/works.js"></script>
  <script src="../js/admin-float.js"></script>
  <script>
    // Back 버튼 클릭 시 홈으로
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.setItem('introVisited', 'true');
        window.location.href = '../index.html';
      });
    }
  </script>
</body>
</html>
