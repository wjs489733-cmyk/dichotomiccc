<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>contact · dichotomiccc</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Galmuri -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" />

  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/contact.css" />

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body class="theme-default">
  <main class="contact-wrap">
    <header class="contact-header">
      <h1 class="galmuri" id="contactTitle" style="cursor: pointer;">contact</h1>
      <a class="back galmuri" href="#" id="backBtn">← back</a>
    </header>

    <section class="contact-card" id="contactContent">
      <h2 class="galmuri" id="contactName">min</h2>

      <div class="contact-links">
        <a href="mailto:wjs400@naver.com" class="contact-link" id="emailLink">
          <span class="link-icon">@</span>
          <span class="link-text" id="emailText">wjs400@naver.com</span>
        </a>

        <a href="https://instagram.com/dichotomiccc" target="_blank" rel="noopener" class="contact-link" id="instagramLink">
          <span class="link-icon">IG</span>
          <span class="link-text" id="instagramText">@dichotomiccc</span>
        </a>
      </div>

      <div id="additionalContent"></div>

      <p class="note" id="pageNote">작업 의뢰 및 협업 문의는 이메일로 부탁드립니다.</p>
    </section>

    <nav class="page-nav galmuri">
      <a href="./about.html" class="nav-link">← about</a>
    </nav>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/home.js"></script>
  <script src="./js/admin-float.js"></script>
  <script>
    const API_URL = CONFIG.API_URL;

    // API에서 Contact 페이지 데이터 로드
    async function loadContactPage() {
      try {
        const response = await fetch(`${API_URL}/pages/contact`);
        if (!response.ok) return;

        const result = await response.json();
        const page = result.data;

        if (page.contactInfo) {
          if (page.contactInfo.email) {
            const emailLink = document.getElementById('emailLink');
            const emailText = document.getElementById('emailText');
            emailLink.href = `mailto:${page.contactInfo.email}`;
            emailText.textContent = page.contactInfo.email;
          }
          if (page.contactInfo.instagram) {
            const instagramLink = document.getElementById('instagramLink');
            const instagramText = document.getElementById('instagramText');
            instagramLink.href = `https://instagram.com/${page.contactInfo.instagram.replace('@', '')}`;
            instagramText.textContent = page.contactInfo.instagram;
          }
        }

        if (page.content && page.content.trim() !== '' && page.content !== '<p><br></p>') {
          document.getElementById('additionalContent').innerHTML = page.content;
        }

        // Note 문구 업데이트
        if (page.note && page.note.trim() !== '') {
          document.getElementById('pageNote').textContent = page.note;
        }

      } catch (error) {
        console.log('Using default contact content');
      }
    }

    // 페이지 로드 시 데이터 가져오기
    loadContactPage();

    // Contact 페이지 네비게이션
    const backBtn = document.getElementById('backBtn');
    const contactTitle = document.getElementById('contactTitle');

    // back 버튼 클릭 시 홈 화면으로 이동 (인트로 건너뛰기)
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.setItem('introVisited', 'true');
        window.location.href = './index.html';
      });
    }

    // contact 제목 클릭 시 홈페이지로 이동 (인트로 건너뛰기)
    if (contactTitle) {
      contactTitle.addEventListener('click', () => {
        localStorage.setItem('introVisited', 'true');
        window.location.href = './index.html';
      });
    }
  </script>
</body>
</html>
