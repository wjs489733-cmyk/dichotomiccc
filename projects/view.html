<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project · dichotomiccc</title>

  <!-- Pretendard -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Galmuri -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/quiple/galmuri@latest/dist/galmuri.css" />

  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/project.css" />

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body class="theme-default">
  <!-- Theme Switcher -->
  <div class="theme-switcher" id="themeSwitcher" aria-label="theme switcher">
    <button class="theme-btn" id="themeBtn" aria-label="테마 열기"></button>
    <div class="theme-menu" id="themeMenu" aria-label="theme menu">
      <button class="theme-option white" data-theme="white" aria-label="화이트 테마"></button>
      <button class="theme-option black" data-theme="black" aria-label="블랙 테마"></button>
      <button class="theme-option mint" data-theme="mint" aria-label="민트 테마"></button>
      <button class="theme-option red hidden" data-theme="red" aria-label="레드 테마" id="redTheme"></button>
    </div>
  </div>

  <main class="project-wrap">
    <header class="project-header">
      <h1 class="galmuri project-title" id="projectTitle">Loading...</h1>
      <a class="back galmuri" href="../index.html" id="backBtn">← back</a>
    </header>

    <article class="project-content" id="projectContent">
      <!-- 로딩 상태 -->
      <div class="loading-state">
        <p class="galmuri">Loading project...</p>
      </div>
    </article>

    <!-- 네비게이션: 카테고리로 돌아가기 -->
    <nav class="project-nav" id="projectNav" style="display: none;">
      <a href="#" class="nav-prev galmuri" id="categoryLink">← back to category</a>
    </nav>
  </main>

  <script src="../js/home.js"></script>
  <script src="../js/project-view.js"></script>
  <script src="../js/admin-float.js"></script>
</body>
</html>
